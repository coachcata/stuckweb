name: Verify Growth Audit live page

# Post-deploy smoke test for the Growth Audit page on the MAIN domain —
# https://www.catalystgrowthcoach.co.uk/growth-audit (Route B: the page
# is part of the main site build; merging to the default branch
# publishes it). Checks page content, asset availability through the
# live path, and a test Netlify Forms submission.
# Run manually from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test against"
        required: false
        default: "https://www.catalystgrowthcoach.co.uk"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Connection diagnostics
        run: |
          BASE="${{ github.event.inputs.base_url || 'https://www.catalystgrowthcoach.co.uk' }}"
          HOST=$(echo "$BASE" | sed 's|https\?://||;s|/.*||')
          echo "== DNS =="
          getent hosts "$HOST" || echo "no DNS record"
          echo "== TLS/HTTP reachability (15s cap) =="
          curl -sv -o /dev/null --connect-timeout 10 --max-time 15 "$BASE/" 2>&1 | grep -E "Connected to|subject:|HTTP/|[Ll]ocation" || true

      - name: Page and asset checks
        run: |
          set -e
          BASE="${{ github.event.inputs.base_url || 'https://www.catalystgrowthcoach.co.uk' }}"
          CURL="curl -sSL --connect-timeout 10 --max-time 40"
          echo "== HTTPS status, URL stays on main domain =="
          $CURL -o /tmp/page.html -w "status=%{http_code} final_url=%{url_effective}\n" "$BASE/growth-audit"
          echo "== Content checks (each must be >=1) =="
          echo -n "hero question: ";      grep -c "Why does growth still depend on" /tmp/page.html
          echo -n "session-wide clip: ";  grep -c 'data-src="/videos/session-wide.mp4"' /tmp/page.html
          echo -n "client-writing clip: ";grep -c 'data-src="/videos/session-client-writing.mp4"' /tmp/page.html
          echo -n "band caption: ";       grep -c "A real question, an hour at the board" /tmp/page.html
          echo -n "form-name field: ";    grep -c 'name="form-name" value="series-signup"' /tmp/page.html
          echo -n "honeypot field: ";     grep -c 'name="bot-field"' /tmp/page.html
          echo -n "canonical URL: ";      grep -c 'rel="canonical" href="https://www.catalystgrowthcoach.co.uk/growth-audit"' /tmp/page.html
          echo "== Hero must have no video =="
          ! sed -n '/<header>/,/<\/header>/p' /tmp/page.html | grep -q "<video"
          echo "hero is text-only: OK"
          echo "== Assets resolve on the main domain =="
          for p in /videos/session-wide.mp4 /videos/session-client-writing.mp4 /images/img-1981.jpg /images/img-1983.jpg; do
            $CURL -o /dev/null -w "$p -> %{http_code} (%{size_download} bytes)\n" "$BASE$p"
          done
          echo "== Navigation back to main site =="
          grep -c 'class="wordmark" href="/"' /tmp/page.html

      - name: Test form submission through the live path
        run: |
          BASE="${{ github.event.inputs.base_url || 'https://www.catalystgrowthcoach.co.uk' }}"
          curl -sS --connect-timeout 10 --max-time 30 -o /tmp/form.out -w "form_post_status=%{http_code}\n" \
            -X POST "$BASE/growth-audit/" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data "form-name=series-signup&email=deploy-test%40catalystgrowthcoach.co.uk&bot-field="
