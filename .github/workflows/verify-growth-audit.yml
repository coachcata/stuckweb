name: Verify Growth Audit live page

# Post-deploy smoke test for the Growth Audit page on the MAIN domain —
# https://catalystgrowthcoach.co.uk/growth-audit (Route B: the page
# is part of the main site build; merging to the default branch
# publishes it). Checks page content, asset availability through the
# live path, and the two routes the page converts by.
#
# The page was rewritten as phase zero of the handover: no signup form
# any more, one whiteboard clip rather than two. The checks below match
# that page. Update them when the page changes, or this test lies.
# Run manually from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test against"
        required: false
        default: "https://catalystgrowthcoach.co.uk"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Connection diagnostics
        run: |
          BASE="${{ github.event.inputs.base_url || 'https://catalystgrowthcoach.co.uk' }}"
          HOST=$(echo "$BASE" | sed 's|https\?://||;s|/.*||')
          echo "== DNS =="
          getent hosts "$HOST" || echo "no DNS record"
          echo "== TLS/HTTP reachability (15s cap) =="
          curl -sv -o /dev/null --connect-timeout 10 --max-time 15 "$BASE/" 2>&1 | grep -E "Connected to|subject:|HTTP/|[Ll]ocation" || true

      - name: Page and asset checks
        run: |
          set -e
          BASE="${{ github.event.inputs.base_url || 'https://catalystgrowthcoach.co.uk' }}"
          CURL="curl -sSL --connect-timeout 10 --max-time 40"
          echo "== HTTPS status, URL stays on main domain =="
          $CURL -o /tmp/page.html -w "status=%{http_code} final_url=%{url_effective}\n" "$BASE/growth-audit"
          echo "== Content checks (each must be >=1) =="
          echo -n "hero heading: ";        grep -c "Why the business stopped growing" /tmp/page.html
          echo -n "client-writing clip: "; grep -c 'data-src="/videos/session-client-writing.mp4"' /tmp/page.html
          echo -n "clip poster: ";         grep -c 'poster="/images/img-1983.jpg"' /tmp/page.html
          echo -n "price stated: ";        grep -c '&pound;1,995' /tmp/page.html
          echo -n "canonical URL: ";       grep -c 'rel="canonical" href="https://catalystgrowthcoach.co.uk/growth-audit"' /tmp/page.html
          echo -n "GA4 tag: ";             grep -c 'G-2Z17HSYFCV' /tmp/page.html
          echo "== No form on this page any more; it must convert by link =="
          echo -n "link to /the-handover: "; grep -c 'href="/the-handover"' /tmp/page.html
          echo -n "link to /contact: ";      grep -c 'href="/contact"' /tmp/page.html
          echo "== Hero must have no video =="
          ! sed -n '/<header>/,/<\/header>/p' /tmp/page.html | grep -q "<video"
          echo "hero is text-only: OK"
          echo "== Assets resolve on the main domain =="
          for p in /videos/session-client-writing.mp4 /images/img-1983.jpg; do
            $CURL -o /dev/null -w "$p -> %{http_code} (%{size_download} bytes)\n" "$BASE$p"
          done
          echo "== Navigation back to main site =="
          grep -c 'class="wordmark" href="/"' /tmp/page.html

      - name: The two conversion routes resolve
        run: |
          set -e
          BASE="${{ github.event.inputs.base_url || 'https://catalystgrowthcoach.co.uk' }}"
          CURL="curl -sSL --connect-timeout 10 --max-time 40"
          for p in /the-handover /contact; do
            $CURL -o /dev/null -w "$p -> %{http_code}\n" "$BASE$p"
          done
